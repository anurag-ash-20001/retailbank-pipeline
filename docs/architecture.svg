  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1b1f24">RetailBank – Customer Transaction Analytics on Databricks (Free Edition, serverless)</text>
  <text x="24" y="56" class="s">Medallion architecture · Unity Catalog <tspan font-weight="600">workspace.rb_*</tspan> · orchestrated by Databricks Workflows (Asset Bundle) · parameter batch_id = day1 | day2 | …</text>

  <!-- Orchestration band -->
  <rect x="24" y="76" width="1152" height="40" rx="8" fill="#eef2f7" stroke="#c9d3df"/>
  <text x="40" y="101" class="s"><tspan font-weight="700">Job “RetailBank - Batch Pipeline”</tspan>  setup → ingest_bronze → (profile_bronze ‖ silver_dimensions) → gold_dimensions → silver_transactions → gold_fact → dq_checks (blocking) → kpis   ·   Job “End-to-End Demo”: reset → day1 → day2</text>

  <!-- columns -->
